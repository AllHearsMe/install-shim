name: Tag Version

# Companion to a release.yml triggered by this workflow completing (via
# workflow_run), not by a tag push directly — GitHub suppresses workflow runs
# triggered by pushes made with the default GITHUB_TOKEN, which is what this
# workflow's tag push uses below, so a plain `on: push: tags:` trigger on
# release.yml would silently never fire for these auto-created tags. See
# release.yml's own header comment for the full reasoning.
#

# Whenever the VERSION file changes on main, this workflow creates and
# pushes the matching tag. VERSION stays the single source of truth for
# the version; this workflow only ever derives a tag from it, never writes back
# to the file.
#
# Portable as-is across any project that keeps a plain VERSION file, as long as:
#   - the default/release branch is "main" (adjust below if not)
#   - VERSION contains nothing but the version string (e.g. "0.1.2"), with
#     optional surrounding whitespace/newline
#   - the release workflow's tag pattern is exactly "v" + that version
#   - release.yml's `workflows:` list is kept in sync with this workflow's
#     `name:` above (see this workflow's coupling note in release.yml)
#
# If the version instead lives in pyproject.toml, package.json, Cargo.toml,
# etc., keep the check/tag steps and swap the "Read version" step for
# whatever parses that file, and name the workflow file after that source,
# e.g. tag-version-from-pyproject.yml.

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need tag history to check whether this version was already tagged.
          fetch-depth: 0

      - name: Read version from VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"